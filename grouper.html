<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />

<title>STEM Group Maker — Exact Rainbow</title>
<!-- Fonts: Fira Sans Black 900 for teacher/class + TABLE headings; Manjari Bold 700 for student names in ALL CAPS; Manjari Bold 700 for top action buttons in ALL CAPS; Quicksand Bold 700 for remaining UI. Top action buttons use rainbow pastel fills. -->
<style>
@font-face{font-family:"KAHomebodyClub";src:url("./KAHomebodyClub.ttf") format("truetype");font-display:swap}
@font-face{font-family:"VAGTaskscreen";src:url("./VAG-Rounded-Std-Black_47296.ttf") format("truetype");font-display:swap}
  :root{
    --ink:#2d2940;
    --muted:#6f6a7e;
    --paper:#fffdf9;
    --panel:#ffffff;
    --line:#e8e2ee;
    --shadow:0 10px 30px rgba(70,55,90,.10);
    --pink:#f5a7c6;
    --orange:#f7be72;
    --yellow:#f5df7a;
    --green:#a9ddb4;
    --blue:#9fcbe8;
    --purple:#c4afe6;
    --accent:#7e68a8;
    --danger:#d45b6a;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family: "VAGTaskscreen",Arial,sans-serif;
    color:var(--ink);
    background:
      radial-gradient(circle at 15% 6%, rgba(245,167,198,.20), transparent 24%),
      radial-gradient(circle at 85% 8%, rgba(159,203,232,.22), transparent 24%),
      linear-gradient(180deg,#fffaf7 0%,#fbfafc 100%);
    overflow:hidden;
  }
  button,input,select,textarea{font:inherit} a.btn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
  button{cursor:pointer}
  .app{
    height:100%;
    min-height:100vh;
    display:grid;
    grid-template-rows:auto 1fr auto;
    gap:10px;
    padding:12px;
  }
  .topbar{
    display:flex;
    align-items:center;
    gap:10px;
    background:rgba(255,255,255,.92);
    border:1px solid var(--line);
    border-radius:18px;
    padding:10px 12px;
    box-shadow:var(--shadow);
    min-height:66px;
  }
  .brand{
    min-width:180px;
    flex:1;
    overflow:hidden;
  }
  .title{
    font-size:clamp(34px,3.4vw,52px);
    line-height:1;
    font-weight:900;
    text-transform:uppercase;
    letter-spacing:-.03em;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }

  /* Canva classroom heading font.
     Keep KAHomebodyClub at its native Regular weight so the browser
     does not create a distorted faux-heavy version. */
  .title,
  .group-name{
    font-family: "KAHomebodyClub","VAGTaskscreen",Arial,sans-serif;
    font-weight:900;
    text-transform:uppercase;
  }

  .subtitle{
    color:var(--muted);
    font-size:13px;
    margin-top:5px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
  }
  .toolbar{
    display:flex;
    flex-wrap:wrap;
    justify-content:flex-end;
    gap:8px;
  }
  .btn{
    font-family:"VAGTaskscreen",Arial,sans-serif;
    font-weight:700;
    text-transform:uppercase;
    text-transform:uppercase;
    border:1px solid var(--line);
    background:#fff;
    color:var(--ink);
    border-radius:12px;
    padding:9px 12px;
    font-weight:800;
    box-shadow:0 3px 10px rgba(50,40,70,.05);

  .btn:hover{transform:translateY(-1px)}
  .btn.primary{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }
  .btn.soft{
    background:#faf7fd;
  }
  .btn.danger{
    color:var(--danger);

  .board{
    min-height:0;
    display:grid;
    position:relative;
    grid-template-columns:repeat(3,minmax(0,1fr));

  .group{
    min-width:0;
    cursor:pointer;
    min-height:0;
    background:rgba(255,255,255,.94);
    border:2px solid var(--group-color,var(--line));
    border-radius:18px;
    box-shadow:var(--shadow);
    display:flex;
    flex-direction:column;
    overflow:hidden;
    position:relative;

  .group.dragover{

    background:transparent;
    color:var(--ink);
    width:100%;
    min-width:0;

    outline:none;

  .count{

    right:10px;
    top:50%;
    transform:translateY(-50%);

    justify-content:center;

    border-color:var(--accent);
  }
  .student-name{
    flex:1;
    min-width:0;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:clamp(20px,1.85vw,29px);
    line-height:1.18;
    font-family:"VAGTaskscreen",Arial,sans-serif;
    font-weight:700;
    -webkit-text-stroke:.25px currentColor;
    text-shadow:0 0 .2px currentColor;
    text-transform:uppercase;
    text-align:center;
    letter-spacing:0;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    position:relative;
    top:0;
    padding-top:3px;
  }
  .mini{
    position:absolute;
    right:6px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:transparent;
    width:28px;height:28px;
    border-radius:8px;
    display:grid;place-items:center;
    font-weight:900;
    color:#80798a;
    flex:0 0 auto;
  }
  .mini:hover{background:#f4f0f7}
  .mini.locked{color:var(--accent);background:#f2ecfa}

  .board.has-focus::after{
    content:"";
    position:absolute;
    inset:-4px;
    z-index:10;
    background:rgba(255,255,255,.30);
    backdrop-filter:blur(5px);
    -webkit-backdrop-filter:blur(5px);
    border-radius:20px;
    pointer-events:none;
  }
  .board.has-focus .group:not(.focused-group){
    filter:blur(1.5px);
    opacity:.68;
    pointer-events:none;
  }
  .focus-placeholder{
    visibility:hidden;
    pointer-events:none;
  }
  .group.focused-group{
    position:absolute;
    z-index:20;
    width:min(620px,68%);
    max-height:88%;
    left:50%;
    top:50%;
    transform:translate(-50%,-50%);
    min-height:0;
    box-shadow:0 18px 60px rgba(45,35,65,.24);
    cursor:pointer;

    padding:14px 56px 13px;
  }
  .group.focused-group .group-name{
    font-size:clamp(40px,4vw,56px);
    text-align:center;
  }
  .group.focused-group .count{
    right:14px;
    font-size:14px;
    padding:6px 10px;
  }
  .group.focused-group .chips{
    justify-content:center;
    padding:16px;
    gap:10px;
    overflow:auto;
  }

    padding:10px 48px 10px 16px;
    border-radius:15px;

  .group.focused-group .student-name{

    line-height:1.16;
    text-align:center;
    text-transform:uppercase;
    letter-spacing:0;
    top:0;
    padding-top:4px;
  }
  .group.focused-group .mini{
    right:9px;
    width:34px;
    height:34px;

  .toolbar .btn{
    font-family:"VAGTaskscreen",Arial,sans-serif;
    font-weight:700;
    -webkit-text-stroke:.28px currentColor;
    text-shadow:0 0 .2px currentColor;
    text-transform:uppercase;
    letter-spacing:0;
    line-height:1.1;
    padding-top:12px;
    padding-bottom:9px;
  }

  /* Rainbow classroom action buttons */
  .toolbar .btn{
    border:2px solid rgba(58,49,70,.08);
    box-shadow:0 3px 0 rgba(58,49,70,.08);
    color:#342d40;
  }
  .toolbar .btn:nth-of-type(1){ background:#ffd7e7; } /* pink */
  .toolbar .btn:nth-of-type(2){ background:#ffe0bd; } /* orange */
  .toolbar .btn:nth-of-type(3){ background:#fff2a9; } /* yellow */
  .toolbar .btn:nth-of-type(4){ background:#d8f3cf; } /* green */
  .toolbar .btn:nth-of-type(5){ background:#cfe9ff; } /* blue */
  .toolbar .btn:nth-of-type(6){ background:#e5d5ff; } /* purple */

    filter:brightness(.98);
    transform:translateY(-1px);
  }


  .toolbar .btn.primary,
  .toolbar .btn.soft,
  .toolbar .btn.warn,
  .toolbar .btn.danger{

  }

  .footer{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    padding:2px 3px;
    color:var(--muted);
    font-size:12px;

  .status{
    flex:0 0 auto;

  }
  .modal-back{
    position:fixed;
    inset:0;
    background:rgba(40,33,52,.38);
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    z-index:20;
  }
  .modal-back.show{display:flex}
  .modal{
    width:min(760px,96vw);
    max-height:90vh;
    overflow:auto;
    background:#fff;
    border-radius:20px;
    border:1px solid var(--line);

  .modal p{margin:0 0 14px;color:var(--muted);font-size:14px}
  .row{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin:10px 0}
  .field{display:flex;flex-direction:column;gap:5px;flex:1;min-width:150px}
  .field label{font-size:12px;font-weight:900;color:#6b6475;text-transform:uppercase;letter-spacing:.06em}
  .field input,.field select,.field textarea{
    width:100%;
    border:1px solid #ddd6e4;
    border-radius:12px;
    padding:10px 11px;
    outline:none;
    background:#fff;
  }
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(126,104,168,.12)}
  textarea{min-height:230px;resize:vertical;line-height:1.45}
  .modal-actions{
    display:flex;justify-content:flex-end;gap:8px;margin-top:14px;flex-wrap:wrap
  }
  .attendance-list,.pair-list,.saved-list{
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
  }
  .attendance-row,.pair-row,.saved-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:9px 10px;
    border-bottom:1px solid #f0edf2;
  }
  .attendance-row:last-child,.pair-row:last-child,.saved-row:last-child{border-bottom:0}
  .attendance-row .who,.pair-row .who,.saved-row .who{flex:1;font-weight:850}
  .toggle{
    border:1px solid var(--line);
    background:#fff;
    border-radius:999px;
    padding:6px 10px;
    font-weight:900;
  }
  .toggle.absent{background:#fff0f2;color:#b94e5d;border-color:#f4cdd2}

  .absent-check{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    min-width:118px;
    min-height:42px;
    border:2px solid #eadfe5;
    border-radius:12px;
    padding:7px 11px 5px;
    background:#fff;
    color:#726778;
    font-family:"VAGTaskscreen",Arial,sans-serif;
    font-size:16px;
    font-weight:700;
    text-transform:uppercase;
    cursor:pointer;
    user-select:none;
  }
  .absent-check input{
    width:20px;
    height:20px;
    accent-color:#d85f79;
    cursor:pointer;
  }
  .absent-check:has(input:checked){
    background:#fff0f2;
    color:#a84055;
    border-color:#efb9c4;
  }

  .badge{
    display:inline-flex;
    align-items:center;
    border-radius:999px;
    padding:4px 8px;
    font-size:11px;
    font-weight:900;
    background:#f3eff7;
  }
  .notice{
    background:#faf7fd;
    border:1px solid #eadff3;
    border-radius:12px;
    padding:10px;
    font-size:13px;
    color:#625b6d;
    margin:10px 0;
  }
  .toast{
    position:fixed;
    left:50%;
    bottom:18px;
    transform:translateX(-50%) translateY(15px);
    opacity:0;
    pointer-events:none;
    background:#2e2937;
    color:#fff;
    padding:9px 13px;
    border-radius:999px;
    font-size:13px;
    font-weight:800;
    z-index:40;
    transition:.2s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .rainbow{
    display:flex;
    gap:4px;
    margin-top:6px;
  }
  .rainbow i{height:5px;flex:1;border-radius:999px}
  .rainbow i:nth-child(1){background:var(--pink)}
  .rainbow i:nth-child(2){background:var(--orange)}
  .rainbow i:nth-child(3){background:var(--yellow)}
  .rainbow i:nth-child(4){background:var(--green)}
  .rainbow i:nth-child(5){background:var(--blue)}
  .rainbow i:nth-child(6){background:var(--purple)}
  @media(max-width:900px){
    .topbar{align-items:flex-start}
    .brand{min-width:120px}
    .board{grid-template-columns:repeat(2,minmax(0,1fr))}
  }
  @media(max-width:620px){
    body{overflow:auto}
    .app{height:auto;min-height:100vh}
    .topbar{flex-direction:column}
    .toolbar{justify-content:flex-start}
    .board{grid-template-columns:1fr}
    .group{min-height:220px}
    .footer{display:none}
  }

/* === EXACT RAINBOW FRAME / CANVA CODE === */
:root{
  --ink:#332B52;
  --muted:#675D82;

  /* Exact colors sampled from the rainbow-border image */
  --rb-pink:#ED3081;
  --rb-orange:#F36C19;
  --rb-yellow:#FCD606;
  --rb-green:#4EAB30;
  --rb-blue:#27B8F5;
  --rb-purple:#834ECF;

  /* Exact main fill colors sampled from the GROUPS letters */
  --word-pink:#F3237C;
  --word-orange:#F47607;
  --word-yellow:#FAB910;
  --word-green:#56A328;
  --word-blue:#075FE8;
  --word-purple:#7618CF;

  --stripe:clamp(5px,.72vw,12px);
}

html,body{
  width:100%;
  height:100%;
  min-width:0;
  min-height:0;
  overflow:hidden;
  background:#fff !important;
}

body{
  position:relative;
}

/* Rounded six-color border, matching the supplied rainbow. */
body::before{
  content:"";
  position:absolute;
  inset:2.2%;
  border:var(--stripe) solid var(--rb-pink);
  border-radius:clamp(42px,5vw,84px);
  box-shadow:
    inset 0 0 0 calc(var(--stripe) * 1) var(--rb-orange),
    inset 0 0 0 calc(var(--stripe) * 2) var(--rb-yellow),
    inset 0 0 0 calc(var(--stripe) * 3) var(--rb-green),
    inset 0 0 0 calc(var(--stripe) * 4) var(--rb-blue),
    inset 0 0 0 calc(var(--stripe) * 5) var(--rb-purple);
  z-index:0;
  pointer-events:none;
}

body::after{
  content:"";
  position:absolute;
  inset:calc(2.2% + (var(--stripe) * 6));
  border-radius:clamp(28px,3.4vw,58px);
  background:#fff;
  z-index:0;
  pointer-events:none;
}

.app{
  position:relative;
  z-index:1;
  width:100%;
  height:100%;
  min-height:0;
  display:grid;
  grid-template-rows:auto 1fr auto;
  gap:clamp(5px,.55vw,9px);
  padding:
    clamp(108px,14vh,154px)
    calc(2.2% + (var(--stripe) * 6) + clamp(9px,1vw,18px))
    calc(2.2% + (var(--stripe) * 6) + clamp(6px,.6vw,11px));
  background:transparent !important;
  overflow:hidden;
}

/* Exact GROUPS word art, centered over the top rainbow.
   Extra transparent padding in the PNG keeps the white outline/shadow intact. */
.groups-heading{
  position:absolute;
  top:clamp(5px,1.2vh,15px);

  transform:translateX(-50%);
  z-index:5;
  width:min(40vw,560px);

}
.groups-heading img{

  max-width:100%;

}

  font-family:"Fira Sans",Arial,sans-serif !important;
  font-weight:900 !important;
  font-size:clamp(22px,1.9vw,34px) !important;
  line-height:1 !important;
  text-transform:uppercase;
  color:var(--group-color) !important;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
}

.count{
  position:absolute !important;
  right:6px !important;
  top:50% !important;
  transform:translateY(-50%) !important;
  font-size:10px !important;
  padding:3px 6px !important;
}

.chips{
  flex:1 1 auto;
  min-height:0;
  display:flex !important;
  flex-direction:column;
  justify-content:flex-start;
  gap:3px !important;
  padding:4px 6px !important;
  overflow:hidden !important;
}

.student{
  flex:0 0 var(--student-row-h,42px);
  height:var(--student-row-h,42px);
  min-height:0 !important;
  max-height:var(--student-row-h,42px);
  box-sizing:border-box;
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  padding:2px 30px 1px 7px !important;
  border:1px solid rgba(51,43,82,.10) !important;
  border-radius:9px !important;
  background:#fff !important;
  overflow:hidden !important;
}

.student-name{
  width:100%;
  min-width:0;
  height:100%;
  display:flex !important;
  align-items:center;
  justify-content:center;
  padding-top:2px !important;
  position:static !important;
  overflow:hidden;
  white-space:nowrap;
  text-overflow:ellipsis;
  color:var(--ink) !important;
  font-family:"Manjari",Arial,sans-serif !important;
  font-weight:700 !important;
  font-size:var(--student-font-size,22px) !important;
  line-height:1.05 !important;
  letter-spacing:0 !important;
  text-transform:uppercase;
  text-align:center;
}

.mini{
  position:absolute !important;
  right:3px !important;
  top:50% !important;
  transform:translateY(-50%) !important;
  width:24px !important;
  height:24px !important;
  font-size:12px !important;
}

.footer{
  min-width:0;
  min-height:0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:0 2px !important;
  background:transparent !important;
  color:var(--muted) !important;
  font-size:clamp(8px,.68vw,11px) !important;
  white-space:nowrap;
  overflow:hidden;
}
.footer .tip{
  overflow:hidden;
  text-overflow:ellipsis;
}
.footer .status{
  flex:0 0 auto;
}

/* Focus view stays centered and never stretches edge-to-edge. */
.board.has-focus::after{
  background:rgba(255,255,255,.32) !important;
  backdrop-filter:blur(5px);
  -webkit-backdrop-filter:blur(5px);
}
.group.focused-group{
  width:min(58vw,700px) !important;
  max-width:calc(100% - 20px) !important;
  max-height:88% !important;
  border-radius:20px !important;
}
.group.focused-group .group-name{
  font-size:clamp(30px,2.8vw,48px) !important;
}
.group.focused-group .student{
  flex-basis:var(--student-row-h,52px);
  height:var(--student-row-h,52px);
  max-height:var(--student-row-h,52px);
}
.group.focused-group .student-name{
  font-size:var(--student-font-size,32px) !important;
}

@media(max-width:980px){
  .app{
    padding-top:clamp(92px,13vh,120px);
  }
  .groups-heading{
    width:min(45vw,470px);
  }
  .topbar{
    grid-template-columns:minmax(150px,.8fr) 1.2fr;
  }
  .toolbar .btn{
    min-height:30px;
    font-size:clamp(9px,.8vw,12px) !important;
    padding:6px 7px 4px !important;
  }
  .group-name{
    font-size:clamp(18px,1.65vw,27px) !important;
  }
}

</style>
</head>

  const freshState = () => {
    const classes = {};

    PRELOADED_ROSTERS.forEach((roster, classIndex) => {
      const classId = `class_seed_${classIndex + 1}`;
      const groups = Array.from({length:6}, (_,i) => ({
        id: `group_seed_${classIndex + 1}_${i + 1}`,
        name: `Table ${i + 1}`,
        color: COLORS[i % COLORS.length],
        students: []
      }));

      const students = roster.students.map((name, studentIndex) => ({
        id: `student_seed_${classIndex + 1}_${studentIndex + 1}`,
        name,
        absent: false,
        locked: false
      }));

      // Start each roster evenly distributed across the six tables.
      students.forEach((student, i) => {
        groups[i % groups.length].students.push(student.id);
      });

      classes[classId] = {
        id: classId,
        name: roster.name,
        groupCount: 6,
        groups,
        students,
        avoidPairs: [],
        togetherPairs: []
      };
    });

    return {
      version: 2,
      currentClassId: PRELOADED_ROSTERS.length ? 'class_seed_1' : null,
      classes,
      undo: []
    };
  };

  let state = loadState();
  let selectedStudentId = null;
  let dragStudentId = null;
  let focusedGroupId = null;

  function uid(prefix='id'){
    return prefix+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4);
  }

  function defaultGroups(n=6){
    return Array.from({length:n},(_,i)=>({
      id: uid('g'),
      name: `Table ${i+1}`,
      color: COLORS[i % COLORS.length],
      students: []
    }));
  }

  function loadState(){
    const base = freshState();
    try{
      const raw = localStorage.getItem('rainbowGrouper_github_v1');
      if(!raw) return base;

      const parsed = JSON.parse(raw);
      if(!parsed || !parsed.classes) return base;

      // Keep any newly bundled classes that have never been saved before,
      // but once a class has been edited, the SAVED roster is authoritative.
      Object.entries(base.classes).forEach(([classId, seededClass])=>{
        if(!parsed.classes[classId]){
          parsed.classes[classId] = seededClass;
          return;
        }

        const c = parsed.classes[classId];
        if(!Array.isArray(c.students)) c.students = [];
        if(!Array.isArray(c.avoidPairs)) c.avoidPairs = [];
        if(!Array.isArray(c.togetherPairs)) c.togetherPairs = [];
        if(!c.name) c.name = seededClass.name;
        if(!Number.isFinite(Number(c.groupCount))) c.groupCount = 6;
        c.groupCount = Math.max(2,Math.min(8,Number(c.groupCount)||6));

        const validStudentIds = new Set(c.students.map(s=>s.id));
        if(!Array.isArray(c.groups) || c.groups.length !== c.groupCount){
          const oldAssigned = Array.isArray(c.groups) ? c.groups.flatMap(x=>x.students||[]).filter(id=>validStudentIds.has(id)) : [];
          c.groups = defaultGroups(c.groupCount);
          oldAssigned.forEach((id,i)=>c.groups[i % c.groups.length].students.push(id));
        }else{
          c.groups.forEach((group,i)=>{
            group.name = group.name || `Table ${i+1}`;
            group.color = COLORS[i % COLORS.length];
            group.students = (group.students || []).filter(id=>validStudentIds.has(id));
          });
        }

        // Remove deleted students from pair rules and assignments.
        c.avoidPairs = c.avoidPairs.filter(([a,b])=>validStudentIds.has(a)&&validStudentIds.has(b));
        c.togetherPairs = c.togetherPairs.filter(([a,b])=>validStudentIds.has(a)&&validStudentIds.has(b));
        c.groups.forEach(group=>{
          group.students = group.students.filter(id=>validStudentIds.has(id));
        });

        // Put active newly-added students into the smallest table.
        const assigned = new Set(c.groups.flatMap(group=>group.students||[]));
        c.students.forEach(s=>{
          if(!s.absent && !assigned.has(s.id)){
            [...c.groups].sort((a,b)=>a.students.length-b.students.length)[0].students.push(s.id);
          }
        });
      });

      if(!parsed.currentClassId || !parsed.classes[parsed.currentClassId]){
        parsed.currentClassId = base.currentClassId;
      }
      if(!Array.isArray(parsed.undo)) parsed.undo = [];
      return parsed;
    }catch(e){
      return base;
    }
  }

  function saveState(){
    try{ localStorage.setItem('rainbowGrouper_github_v1', JSON.stringify({...state, undo: state.undo.slice(-20)})); }catch(e){}
  }

  function currentClass(){
    return state.currentClassId ? state.classes[state.currentClassId] : null;
  }

  function ensureClass(){
    if(currentClass()) return currentClass();
    const id = uid('class');
    state.classes[id] = {
      id,
      name: 'My Class',
      groupCount: 6,
      groups: defaultGroups(6),
      students: [],
      avoidPairs: [],
      togetherPairs: []
    };
    state.currentClassId = id;
    saveState();
    return state.classes[id];
  }

  function snapshot(label='Change'){
    const c = currentClass();
    if(!c) return;
    state.undo.push({label, classId:c.id, classData:JSON.parse(JSON.stringify(c))});
    if(state.undo.length > 20) state.undo.shift();
  }

  function undo(){
    const item = state.undo.pop();
    if(!item){ toast('Nothing to undo'); return; }
    state.classes[item.classId] = item.classData;
    state.currentClassId = item.classId;
    selectedStudentId = null;
    saveState();
    render();
    toast(`Undid: ${item.label}`);
  }

  function normalizeGroups(c){
    if(!Array.isArray(c.groups)) c.groups = [];
    if(c.groups.length !== c.groupCount){
      const old = c.groups;
      const allAssigned = old.flatMap(g => g.students || []);
      const next = [];
      for(let i=0;i<c.groupCount;i++){
        next.push(old[i] || {id:uid('g'),name:`Table ${i+1}`,color:COLORS[i%COLORS.length],students:[]});
      }
      next.forEach(g => g.students=[]);
      allAssigned.forEach((sid,i)=>next[i % next.length].students.push(sid));
      c.groups = next;
    }
  }

  function activeStudents(c){
    return c.students.filter(s => !s.absent);
  }

  function assignedSet(c){
    return new Set(c.groups.flatMap(g => g.students));
  }

  function cleanAssignments(c){
    const active = new Set(activeStudents(c).map(s=>s.id));
    const seen = new Set();
    c.groups.forEach(g=>{
      g.students = (g.students||[]).filter(id=>{
        if(!active.has(id) || seen.has(id)) return false;
        seen.add(id); return true;
      });
    });
  }

  function getStudent(c,id){ return c.students.find(s=>s.id===id); }
  function getGroupOf(c,id){ return c.groups.find(g=>(g.students||[]).includes(id)); }

  function render(){
    const c = currentClass();
    const title = document.getElementById('classTitle');
    const sub = document.getElementById('classSubtitle');
    const board = document.getElementById('board');
    const status = document.getElementById('status');

    if(!c){
      title.textContent = 'Live Group Board';
      sub.textContent = 'Add a class roster to begin.';
      board.innerHTML = emptyWelcome();
      status.textContent = '0 active · 0 absent';
      return;
    }

    normalizeGroups(c);
    cleanAssignments(c);

    title.textContent = c.name || 'Live Group Board';
    const active = activeStudents(c);
    const absent = c.students.filter(s=>s.absent);
    sub.textContent = `${active.length} active student${active.length===1?'':'s'} · ${c.groupCount} groups`;
    status.textContent = `${active.length} active · ${absent.length} absent`;

    const boardCols = c.groupCount <= 4 ? 2 : 3;
    const boardRows = Math.ceil(c.groupCount / boardCols);
    board.style.gridTemplateColumns = `repeat(${boardCols},minmax(0,1fr))`;
    board.style.gridTemplateRows = `repeat(${boardRows},minmax(0,1fr))`;
    board.innerHTML = '';
    board.classList.toggle('has-focus', !!focusedGroupId);

    if(focusedGroupId && !c.groups.some(g => g.id === focusedGroupId)){
      focusedGroupId = null;
      board.classList.remove('has-focus');
    }

    c.groups.forEach((g) => {
      const gi = c.groups.findIndex(x => x.id === g.id);
      const el = document.createElement('section');
      el.className = 'group';

      if(focusedGroupId === g.id){
        const placeholder = document.createElement('div');
        placeholder.className = 'focus-placeholder';
        placeholder.setAttribute('aria-hidden','true');
        board.appendChild(placeholder);
        el.classList.add('focused-group');
      }
      el.dataset.groupId = g.id;
      el.style.setProperty('--group-color', g.color || COLORS[gi%COLORS.length]);

      el.addEventListener('dragover', e=>{e.preventDefault(); el.classList.add('dragover')});
      el.addEventListener('dragleave', ()=>el.classList.remove('dragover'));
      el.addEventListener('drop', e=>{
        e.preventDefault();
        el.classList.remove('dragover');
        if(dragStudentId) moveStudent(dragStudentId,g.id);
      });
      el.addEventListener('click', e=>{
        // Keep the small lock control independent.
        if(e.target.closest('button')) return;

        // If this table is already full-screen, clicking anywhere in
        // the table returns to the six-table view.
        if(focusedGroupId === g.id){
          focusedGroupId=null;
          selectedStudentId=null;
          render();
          return;
        }

        const clickedStudent = e.target.closest('.student');

        // Preserve click-to-move behavior when a student is already selected.
        if(selectedStudentId && !clickedStudent){
          moveStudent(selectedStudentId,g.id);
          return;
        }

        // Header, count, table background, and empty space all zoom.
        if(!selectedStudentId && !clickedStudent){
          focusedGroupId=g.id;
          render();
        }
      });

      const head = document.createElement('div');
      head.className='group-head';

      const groupName = document.createElement('div');
      groupName.className='group-name';
      groupName.textContent=g.name || `Table ${gi+1}`;

      const count = document.createElement('span');
      count.className='count';
      count.textContent=(g.students||[]).length;

      head.append(groupName,count);

      const chips = document.createElement('div');
      chips.className='chips';

      if(!(g.students||[]).length){
        const empty=document.createElement('div');
        empty.className='empty';
        empty.textContent = selectedStudentId ? 'Click here to move selected student' : 'Drop students here';
        chips.append(empty);
      } else {
        g.students.forEach(id=>{
          const s=getStudent(c,id);
          if(!s) return;
          chips.append(studentChip(s,g));
        });
      }

      el.append(head,chips);
      board.append(el);
    });

    saveState();
    requestAnimationFrame(fitBoard);
  }

  function emptyWelcome(){
    return `<section class="group" style="grid-column:1/-1;min-height:280px;--group-color:#c4afe6">
      <div class="group-head"><div class="group-name">Ready when you are</div></div>
      <div class="empty" style="font-size:18px">Click <b>Classes</b> or <b>Roster</b> to add your first class.</div>
    </section>`;
  }

  function studentChip(s,g){
    const div=document.createElement('div');
    div.className='student'+(selectedStudentId===s.id?' selected':'');
    div.draggable=true;
    div.dataset.studentId=s.id;

    div.addEventListener('dragstart',()=>{
      dragStudentId=s.id;
      div.classList.add('dragging');
    });
    div.addEventListener('dragend',()=>{
      dragStudentId=null;
      div.classList.remove('dragging');
      document.querySelectorAll('.group.dragover').forEach(x=>x.classList.remove('dragover'));
    });
    div.addEventListener('click',e=>{
      if(e.target.closest('button')) return;

      // When a group is filling the screen, the entire visible group
      // behaves like a large "back to all groups" target.
      if(focusedGroupId){
        focusedGroupId=null;
        selectedStudentId=null;
        render();
        return;
      }

      selectedStudentId = selectedStudentId===s.id ? null : s.id;
      render();
    });

    const name=document.createElement('div');
    name.className='student-name';
    name.textContent=s.name;

    const lock=document.createElement('button');
    lock.className='mini'+(s.locked?' locked':'');
    lock.title=s.locked?'Unlock student':'Lock student to this table';
    lock.textContent=s.locked?'🔒':'🔓';
    lock.addEventListener('click',e=>{
      e.stopPropagation();
      snapshot(s.locked?'Unlock student':'Lock student');
      s.locked=!s.locked;
      saveState(); render();
    });

    div.append(name,lock);
    return div;
  }

  function moveStudent(studentId,targetGroupId){
    const c=currentClass(); if(!c) return;
    const s=getStudent(c,studentId); if(!s) return;
    const source=getGroupOf(c,studentId);
    const target=c.groups.find(g=>g.id===targetGroupId);
    if(!target || (source && source.id===target.id)){ selectedStudentId=null; render(); return; }

    snapshot('Move student');
    if(source) source.students=source.students.filter(id=>id!==studentId);
    target.students.push(studentId);
    selectedStudentId=null;
    saveState(); render();
  }

  function buildTogetherComponents(c, activeIds){
    const ids=[...activeIds];
    const parent=new Map(ids.map(id=>[id,id]));

    const find=id=>{
      let p=parent.get(id);
      if(p===undefined) return id;
      while(p!==parent.get(p)){
        parent.set(p,parent.get(parent.get(p)));
        p=parent.get(p);
      }
      return p;
    };

    const union=(a,b)=>{
      if(!parent.has(a)||!parent.has(b)) return;
      const ra=find(a), rb=find(b);
      if(ra!==rb) parent.set(rb,ra);
    };

    for(const [a,b] of c.togetherPairs||[]) union(a,b);

    const groups=new Map();
    ids.forEach(id=>{
      const root=find(id);
      if(!groups.has(root)) groups.set(root,[]);
      groups.get(root).push(id);
    });
    return [...groups.values()];
  }

  function shuffleGroups(recordUndo=true, showToast=true){
    const c=ensureClass();
    cleanAssignments(c);
    const active=activeStudents(c);
    if(!active.length){
      if(showToast) openRoster();
      return;
    }

    if(recordUndo) snapshot('Shuffle groups');

    const activeIds=new Set(active.map(s=>s.id));
    const lockedGroupFor=new Map();
    c.groups.forEach(g=>{
      (g.students||[]).forEach(id=>{
        const s=getStudent(c,id);
        if(s && s.locked && activeIds.has(id)) lockedGroupFor.set(id,g.id);
      });
    });

    const components=buildTogetherComponents(c,activeIds);
    let impossibleTogether=false;
    let best=null, bestScore=Infinity;

    const attempts=Math.min(900,Math.max(180,active.length*30));

    for(let attempt=0;attempt<attempts;attempt++){
      const candidate=c.groups.map(g=>({id:g.id,students:[]}));

      // Locked students stay at their current tables.
      lockedGroupFor.forEach((groupId,studentId)=>{
        const cg=candidate.find(g=>g.id===groupId);
        if(cg) cg.students.push(studentId);
      });

      const freeUnits=[];

      components.forEach(unit=>{
        const lockedGroups=[...new Set(unit.map(id=>lockedGroupFor.get(id)).filter(Boolean))];
        const unlockedMembers=unit.filter(id=>!lockedGroupFor.has(id));

        if(lockedGroups.length===1){
          // If one member is locked, keep the rest of that together-unit with them.
          const cg=candidate.find(g=>g.id===lockedGroups[0]);
          if(cg) unlockedMembers.forEach(id=>cg.students.push(id));
        }else if(lockedGroups.length>1){
          // Two locked members of one together-unit are already at different tables.
          impossibleTogether=true;
          unlockedMembers.forEach(id=>{
            const choices=lockedGroups
              .map(gid=>candidate.find(g=>g.id===gid))
              .filter(Boolean)
              .sort((a,b)=>a.students.length-b.students.length);
            if(choices[0]) choices[0].students.push(id);
          });
        }else{
          freeUnits.push([...unit]);
        }
      });

      // Randomize bundles, with larger bundles first often enough to keep balance.
      for(let i=freeUnits.length-1;i>0;i--){
        const j=Math.floor(Math.random()*(i+1));
        [freeUnits[i],freeUnits[j]]=[freeUnits[j],freeUnits[i]];
      }
      freeUnits.sort((a,b)=>b.length-a.length || Math.random()-.5);

      freeUnits.forEach(unit=>{
        let choices=candidate.map(g=>{
          const projected=[...g.students,...unit];
          let penalty=projected.length*10;

          // Strongly prefer placements that do not violate Keep Apart.
          for(const [a,b] of c.avoidPairs||[]){
            if(projected.includes(a)&&projected.includes(b)) penalty+=1200;
          }

          return {g,penalty};
        });

        choices.sort((a,b)=>a.penalty-b.penalty || Math.random()-.5);
        choices[0].g.students.push(...unit);
      });

      const score=scoreCandidate(c,candidate);
      if(score<bestScore){
        bestScore=score;
        best=candidate.map(x=>({id:x.id,students:[...x.students]}));
      }
      if(score===0) break;
    }

    if(best){
      c.groups.forEach(g=>{
        const b=best.find(x=>x.id===g.id);
        g.students=b?b.students:[];
      });
    }

    selectedStudentId=null;
    focusedGroupId=null;
    saveState();
    render();

    if(showToast){
      if(impossibleTogether){
        toast('Shuffled — locked students make one KEEP TOGETHER rule impossible');
      }else if(bestScore>0 && ((c.avoidPairs||[]).length || (c.togetherPairs||[]).length)){
        toast('Shuffled — one rule may be unavoidable');
      }else{
        toast('Groups shuffled');
      }
    }
  }

  function shuffle(){
    shuffleGroups(true,true);
  }

  function scoreCandidate(c,candidate){
    let score=0;
    const sizes=candidate.map(x=>x.students.length);
    const max=Math.max(...sizes), min=Math.min(...sizes);
    score+=(max-min)*25;

    for(const [a,b] of c.avoidPairs||[]){
      if(candidate.some(g=>g.students.includes(a)&&g.students.includes(b))) score+=1000;
    }

    for(const [a,b] of c.togetherPairs||[]){
      if(!candidate.some(g=>g.students.includes(a)&&g.students.includes(b))) score+=1600;
    }

    return score;
  }

  function fitBoard(){
    const board=document.getElementById('board');
    if(!board) return;

    const visibleGroups=[...board.querySelectorAll('.group')].filter(g=>!g.classList.contains('focus-placeholder'));
    visibleGroups.forEach(group=>{
      const head=group.querySelector('.group-head');
      const chips=group.querySelector('.chips');
      const students=[...group.querySelectorAll('.student')];
      if(!head || !chips || !students.length) return;

      const available=Math.max(80,group.clientHeight-head.offsetHeight-8);
      const gap=3;
      let rowH=Math.floor((available-gap*Math.max(0,students.length-1))/students.length);

      const focused=group.classList.contains('focused-group');
      const minH=focused?42:27;
      const maxH=focused?68:52;
      rowH=Math.max(minH,Math.min(maxH,rowH));

      let fontSize=Math.floor(rowH*(focused?.52:.47));
      fontSize=Math.max(focused?20:13,Math.min(focused?40:27,fontSize));

      group.style.setProperty('--student-row-h',`${rowH}px`);
      group.style.setProperty('--student-font-size',`${fontSize}px`);
    });
  }

  window.addEventListener('resize',()=>requestAnimationFrame(fitBoard));

  function openModal(html, onOpen){
    const back=document.getElementById('modalBack');
    const modal=document.getElementById('modal');
    modal.innerHTML=html;
    back.classList.add('show');
    back.setAttribute('aria-hidden','false');
    if(onOpen) onOpen(modal);
  }

  function closeModal(){
    document.getElementById('modalBack').classList.remove('show');
    document.getElementById('modalBack').setAttribute('aria-hidden','true');
  }

  document.getElementById('modalBack').addEventListener('click',e=>{
    if(e.target.id==='modalBack') closeModal();
  });
  document.addEventListener('keydown',e=>{
    if(e.key==='Escape') closeModal();
  });

  function openClasses(){
    const classes=Object.values(state.classes);
    openModal(`
      <h2>Classes</h2><p>Your class rosters save on this computer. Add or delete names in Roster and they stay that way.</p>
      <p>Choose a class, then use Roster anytime to add, rename, or delete students.</p>
      <div class="field" style="margin-bottom:10px">
        <label>Find a class</label>
        <input id="classSearch" placeholder="Start typing a teacher name..." />
      </div>
      <div class="saved-list" id="savedList">
        ${classes.length ? classes.map(c=>`
          <div class="saved-row" data-id="${c.id}">
            <div class="who">${escapeHtml(c.name)} <span class="badge">${c.students.length} students</span></div>
            <button class="btn soft choose">Open</button>
          </div>`).join('') : `<div class="attendance-row"><div class="who" style="color:#8f8898">No saved classes yet.</div></div>`}
      </div>
      <div class="row">
        <div class="field">
          <label>New class name</label>
          <input id="newClassName" placeholder="Mrs. Smith's Class" />
        </div>
        <div class="field" style="max-width:170px">
          <label>Number of groups</label>
          <select id="newGroupCount">
            ${[2,3,4,5,6,7,8].map(n=>`<option ${n===6?'selected':''}>${n}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="modal-actions">
        <button class="btn" id="close">Close</button>
        <button class="btn primary" id="create">Create Class</button>
      </div>
    `, modal=>{
      modal.querySelector('#close').onclick=closeModal;

      const classSearch = modal.querySelector('#classSearch');
      if(classSearch){
        classSearch.oninput = () => {
          const q = classSearch.value.trim().toLowerCase();
          modal.querySelectorAll('.saved-row').forEach(row => {
            const teacher = (state.classes[row.dataset.id]?.name || '').toLowerCase();
            row.style.display = !q || teacher.includes(q) ? '' : 'none';
          });
        };
      }

      modal.querySelector('#create').onclick=()=>{
        const name=modal.querySelector('#newClassName').value.trim() || `Class ${Object.keys(state.classes).length+1}`;
        const groupCount=Number(modal.querySelector('#newGroupCount').value)||6;
        const id=uid('class');
        state.classes[id]={id,name,groupCount,groups:defaultGroups(groupCount),students:[],avoidPairs:[],togetherPairs:[]};
        state.currentClassId=id;
        saveState(); closeModal(); render(); openRoster();
      };
      modal.querySelectorAll('.saved-row').forEach(row=>{
        const id=row.dataset.id;
        const choose=row.querySelector('.choose');
        if(choose) choose.onclick=()=>{
          state.currentClassId=id;
          selectedStudentId=null;
          focusedGroupId=null;
          saveState();
          closeModal();
          shuffleGroups(false, false);
        };
      });
    });
  }

  function openRoster(){
    const c=ensureClass();
    const rosterText=c.students.map(s=>s.name).join('\n');
    openModal(`
      <h2>Roster</h2>
      <p>Paste one student per line. Existing names are matched automatically, so locks and attendance are kept when possible.</p>
      <div class="row">
        <div class="field">
          <label>Class name</label>
          <input id="className" value="${escapeAttr(c.name)}" />
        </div>
        <div class="field" style="max-width:170px">
          <label>Groups</label>
          <select id="groupCount">
            ${[2,3,4,5,6,7,8].map(n=>`<option ${n===c.groupCount?'selected':''}>${n}</option>`).join('')}
          </select>
        </div>
      </div>
      <div class="field">
        <label>Student names</label>
        <textarea id="rosterText" placeholder="Avery Smith&#10;Jordan Lee&#10;Mia Brown">${escapeHtml(rosterText)}</textarea>
      </div>
      <div class="notice">You can paste names in any order. Blank lines and duplicate names are ignored.</div>
      <div class="modal-actions">
        <button class="btn" id="cancel">Cancel</button>
        <button class="btn primary" id="saveRoster">Save Roster</button>
      </div>
    `, modal=>{
      modal.querySelector('#cancel').onclick=closeModal;
      modal.querySelector('#saveRoster').onclick=()=>{
        snapshot('Edit roster');
        c.name=modal.querySelector('#className').value.trim()||'My Class';
        const newCount=Number(modal.querySelector('#groupCount').value)||6;
        const names=[...new Set(modal.querySelector('#rosterText').value.split(/\r?\n/).map(x=>x.trim()).filter(Boolean))];
        const oldByName=new Map(c.students.map(s=>[s.name.toLowerCase(),s]));
        c.students=names.map(name=>{
          const old=oldByName.get(name.toLowerCase());
          return old ? {...old,name} : {id:uid('s'),name,absent:false,locked:false};
        });
        const valid=new Set(c.students.map(s=>s.id));
        c.avoidPairs=(c.avoidPairs||[]).filter(([a,b])=>valid.has(a)&&valid.has(b));
        c.togetherPairs=(c.togetherPairs||[]).filter(([a,b])=>valid.has(a)&&valid.has(b));
        c.groupCount=newCount;
        normalizeGroups(c);
        cleanAssignments(c);

        const assigned=assignedSet(c);
        const unassigned=activeStudents(c).filter(s=>!assigned.has(s.id));
        unassigned.forEach((s,i)=>{
          const target=[...c.groups].sort((a,b)=>a.students.length-b.students.length)[0];
          target.students.push(s.id);
        });
        saveState(); closeModal(); render();
        toast('Roster saved');
      };
    });
  }

  function openAttendance(){
    const c=ensureClass();
    if(!c.students.length){ openRoster(); return; }
    const sorted=[...c.students].sort((a,b)=>a.name.localeCompare(b.name));
    openModal(`
      <h2>Attendance</h2>
      <p>Everyone is assumed present. Check only the students who are ABSENT.</p>
      <div class="attendance-list">
        ${sorted.map(s=>`
          <div class="attendance-row" data-id="${s.id}">
            <div class="who">${escapeHtml(s.name)}</div>
            <label class="absent-check">
              <input class="absent-box" type="checkbox" ${s.absent?'checked':''} />
              <span>Absent</span>
            </label>
          </div>`).join('')}
      </div>
      <div class="modal-actions">
        <button class="btn primary" id="done">Done</button>
      </div>
    `, modal=>{
      modal.querySelectorAll('.attendance-row').forEach(row=>{
        const box=row.querySelector('.absent-box');
        box.onchange=()=>{
          const s=getStudent(c,row.dataset.id);
          const shouldBeAbsent=box.checked;

          if(s.absent===shouldBeAbsent) return;

          snapshot(shouldBeAbsent?'Mark absent':'Remove absent mark');
          s.absent=shouldBeAbsent;

          if(s.absent){
            c.groups.forEach(g=>g.students=g.students.filter(id=>id!==s.id));
          }else{
            const assigned=assignedSet(c);
            if(!assigned.has(s.id)){
              const target=[...c.groups].sort((a,b)=>a.students.length-b.students.length)[0];
              target.students.push(s.id);
            }
          }

          saveState();
          render();
        };
      });
      modal.querySelector('#done').onclick=closeModal;
    });
  }

  function openPairs(){
    const c=ensureClass();
    if(c.students.length<2){ openRoster(); return; }
    const options=c.students.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');
    openModal(`
      <h2>Keep Apart</h2>
      <p>Add pairs you do not want placed at the same table when you shuffle.</p>
      <div class="row">
        <div class="field"><label>Student 1</label><select id="p1">${options}</select></div>
        <div class="field"><label>Student 2</label><select id="p2">${options}</select></div>
        <button class="btn primary" id="addPair">Add Pair</button>
      </div>
      <div class="pair-list">
        ${(c.avoidPairs||[]).length ? c.avoidPairs.map((pair,i)=>{
          const a=getStudent(c,pair[0]), b=getStudent(c,pair[1]);
          return `<div class="pair-row" data-i="${i}">
            <div class="who">${escapeHtml(a?a.name:'Unknown')} <span class="badge">apart from</span> ${escapeHtml(b?b.name:'Unknown')}</div>
            <button class="btn danger remove">Remove</button>
          </div>`;
        }).join('') : `<div class="attendance-row"><div class="who" style="color:#8f8898">No keep-apart pairs yet.</div></div>`}
      </div>
      <div class="modal-actions">
        <button class="btn primary" id="done">Done</button>
      </div>
    `, modal=>{
      const p1=modal.querySelector('#p1'), p2=modal.querySelector('#p2');
      if(p2.options.length>1) p2.selectedIndex=1;
      modal.querySelector('#addPair').onclick=()=>{
        if(p1.value===p2.value){ toast('Choose two different students'); return; }
        const exists=(c.avoidPairs||[]).some(([a,b])=>(a===p1.value&&b===p2.value)||(a===p2.value&&b===p1.value));
        if(exists){ toast('That pair is already listed'); return; }
        const togetherConflict=(c.togetherPairs||[]).some(([a,b])=>(a===p1.value&&b===p2.value)||(a===p2.value&&b===p1.value));
        if(togetherConflict){ toast('That pair is already set to KEEP TOGETHER'); return; }
        snapshot('Add keep-apart pair');
        c.avoidPairs.push([p1.value,p2.value]);
        saveState(); openPairs();
      };
      modal.querySelectorAll('.pair-row').forEach(row=>{
        row.querySelector('.remove').onclick=()=>{
          snapshot('Remove keep-apart pair');
          c.avoidPairs.splice(Number(row.dataset.i),1);
          saveState(); openPairs();
        };
      });
      modal.querySelector('#done').onclick=closeModal;
    });
  }

  function openTogether(){
    const c=ensureClass();
    if(c.students.length<2){ openRoster(); return; }
    if(!Array.isArray(c.togetherPairs)) c.togetherPairs=[];

    const options=c.students.map(s=>`<option value="${s.id}">${escapeHtml(s.name)}</option>`).join('');

    openModal(`
      <h2>Keep Together</h2>
      <p>Add pairs you want placed at the same table whenever you shuffle.</p>
      <div class="row">
        <div class="field"><label>Student 1</label><select id="t1">${options}</select></div>
        <div class="field"><label>Student 2</label><select id="t2">${options}</select></div>
        <button class="btn primary" id="addTogether">Add Pair</button>
      </div>
      <div class="pair-list">
        ${(c.togetherPairs||[]).length ? c.togetherPairs.map((pair,i)=>{
          const a=getStudent(c,pair[0]), b=getStudent(c,pair[1]);
          return `<div class="pair-row" data-i="${i}">
            <div class="who">${escapeHtml(a?a.name:'Unknown')} <span class="badge">together with</span> ${escapeHtml(b?b.name:'Unknown')}</div>
            <button class="btn danger remove">Remove</button>
          </div>`;
        }).join('') : `<div class="attendance-row"><div class="who" style="color:#8f8898">No keep-together pairs yet.</div></div>`}
      </div>
      <div class="modal-actions">
        <button class="btn primary" id="done">Done</button>
      </div>
    `,modal=>{
      const t1=modal.querySelector('#t1'), t2=modal.querySelector('#t2');
      if(t2.options.length>1) t2.selectedIndex=1;

      modal.querySelector('#addTogether').onclick=()=>{
        if(t1.value===t2.value){ toast('Choose two different students'); return; }

        const exists=(c.togetherPairs||[]).some(([a,b])=>
          (a===t1.value&&b===t2.value)||(a===t2.value&&b===t1.value)
        );
        if(exists){ toast('That pair is already listed'); return; }

        const apartConflict=(c.avoidPairs||[]).some(([a,b])=>
          (a===t1.value&&b===t2.value)||(a===t2.value&&b===t1.value)
        );
        if(apartConflict){ toast('That pair is already set to KEEP APART'); return; }

        snapshot('Add keep-together pair');
        c.togetherPairs.push([t1.value,t2.value]);
        saveState();
        openTogether();
      };

      modal.querySelectorAll('.pair-row').forEach(row=>{
        row.querySelector('.remove').onclick=()=>{
          snapshot('Remove keep-together pair');
          c.togetherPairs.splice(Number(row.dataset.i),1);
          saveState();
          openTogether();
        };
      });

      modal.querySelector('#done').onclick=closeModal;
    });
  }

  function toast(msg){
    const t=document.getElementById('toast');
    t.textContent=msg;
    t.classList.add('show');
    clearTimeout(toast._t);
    toast._t=setTimeout(()=>t.classList.remove('show'),1600);
  }

  function escapeHtml(s=''){
    return String(s).replace(/[&<>"']/g,m=>({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;' }[m]));
  }
  function escapeAttr(s=''){ return escapeHtml(s).replace(/`/g,'&#096;'); }

  document.getElementById('classesBtn').onclick=openClasses;
  document.getElementById('rosterBtn').onclick=openRoster;
  document.getElementById('attendanceBtn').onclick=openAttendance;
  document.getElementById('pairsBtn').onclick=openPairs;
  document.getElementById('togetherBtn').onclick=openTogether;
  document.getElementById('shuffleBtn').onclick=shuffle;

  ensureClass();
  render();
})();
</script>
</body>
</html>
